# VQ-VAE mad300 entrenado SIN seis clases, que quedan reservadas como conjunto
# de anomalias reales: SNIa-91bg, SNIax, SNIIb+HostXT_V19, SLSN-I+host,
# SLSN-I_no_host y PISN.
#
# Mismas imagenes y misma codificacion que configs/vqvae_enc_mad300_full.yaml;
# lo unico que cambia es que folds_heldout.json solo contiene las once clases
# vistas, y que las etiquetas vienen remapeadas a 0..10 porque los indices
# originales quedan con huecos.
#
# 967.639 imagenes, el 70% del dataset completo, por lo que se estiman ~15 h.
vqvae:
  in_channels: 3
  hidden_channels: [64, 128, 256]
  embedding_dim: 256
  num_embeddings: 512
  commitment_cost: 0.25
  learning_rate: 0.0002
  batch_size: 32
  num_epochs: 25
  num_workers: 8
  image_dir: "data/enc_cmp/mad300/images"
  image_size: 256
  val_split: 0.1
  folds_path: "data/enc_cmp/mad300/folds_heldout.json"
  labels_path: "data/enc_cmp/mad300/labels_heldout.json"
  num_classes: 11
  cls_weight: 0.1
  cls_dropout: 0.1
  checkpoint_dir: "results/enc_cmp_heldout/mad300/vqvae/checkpoints"
  log_dir: "results/enc_cmp_heldout/mad300/vqvae/logs"
