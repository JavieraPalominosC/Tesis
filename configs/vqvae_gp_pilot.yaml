# Piloto: superficies GP (Förster / ALeRCE sample v2) como input del VQ-VAE.
# Mean as-is del tar (ya / scale_mean), 26 clases balanceadas, 256→32 tokens.
vqvae:
  in_channels: 1
  hidden_channels: [64, 128, 256]
  embedding_dim: 256
  num_embeddings: 512
  commitment_cost: 0.25
  learning_rate: 0.0002
  batch_size: 32
  # ~20.8k objetos cv: una epoca deberia ser minutos en GPU Leftraru.
  num_epochs: 25
  num_workers: 8
  image_dir: "data/gp_pilot/images"
  image_size: 256
  folds_path: "data/gp_pilot/folds.json"
  labels_path: "data/gp_pilot/labels.json"
  num_classes: 26
  cls_weight: 0.1
  cls_dropout: 0.1
  checkpoint_dir: "results/gp_pilot/vqvae/checkpoints"
  log_dir: "results/gp_pilot/vqvae/logs"

